name: Moneo correction
description: Suggest a fix for an incorrect Korean or English string in a moneo flashcard.
title: "[moneo] Correction: "
labels: ["moneo", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve PokéTrek's bilingual decks. Most fields
        are pre-filled when you arrive here from the in-app **✎ Report**
        button. Edit whichever side is wrong (Korean, English, or both)
        and leave the rest as-is.

        After review the maintainer will relabel this as `ko-fix` or
        `en-fix` depending on which side needed correcting.

  - type: input
    id: vocab-id
    attributes:
      label: Vocab ID
      description: Stable identifier of the headword the sentence belongs to (e.g. `rom-mine-v3:포켓몬`). Pre-filled by the app.
    validations:
      required: true

  - type: input
    id: vocab-headword
    attributes:
      label: Headword
      description: Korean / English of the affected vocab card.
    validations:
      required: false

  - type: textarea
    id: current-korean
    attributes:
      label: Current Korean
      description: The Korean text as it currently appears in the bundled JSON.
      render: text
    validations:
      required: true

  - type: textarea
    id: current-gloss
    attributes:
      label: Current English
      description: The English text (vocab gloss or sentence translation) as currently shipped.
      render: text
    validations:
      required: false

  - type: textarea
    id: proposed-korean
    attributes:
      label: Proposed Korean
      description: Your suggested replacement Korean. Leave empty if the Korean side is fine.
      render: text
    validations:
      required: false

  - type: textarea
    id: proposed-gloss
    attributes:
      label: Proposed English
      description: Your suggested replacement English. Leave empty if the English side is fine.
      render: text
    validations:
      required: false

  - type: textarea
    id: reason
    attributes:
      label: What's wrong?
      description: Grammar issue, wrong particle, mistranslation, awkward phrasing, … Anything that helps a maintainer triage.
    validations:
      required: false

  - type: input
    id: source
    attributes:
      label: Source tag
      description: Provenance from the bundled JSON (e.g. `rom-rec1344`, `gMoveNames[1]`). Helps locate the entry across files.

  - type: input
    id: speaker
    attributes:
      label: Speaker
      description: NPC name when the line is attributed (e.g. `오키드`).

  - type: input
    id: generator
    attributes:
      label: Generator tag
      description: |
        Who wrote the line:
        - `llm-<model>` — produced by an LLM (likely candidate for grammar/translation fixes)
        - `human` — hand-curated
        - empty — verbatim from the ROM

  - type: input
    id: area-id
    attributes:
      label: Area
      description: In-game area where the sentence surfaced (e.g. `pallet_town`).

  - type: input
    id: app-version
    attributes:
      label: App version
      description: PokéTrek build that produced the report.

  - type: input
    id: rom-crc32
    attributes:
      label: ROM CRC32
      description: Hex CRC32 of the loaded ROM (e.g. `0xDAFFECEC` for US Rev 1, `0x4A38A8CB` for KR 2024).
